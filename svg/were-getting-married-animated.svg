<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="470"
     viewBox="60 280 900 470"
     role="img"
     aria-labelledby="title desc">
  <title id="title">We&#8217;re getting married</title>
  <desc id="desc">Hand-drawn pastel lettering writes We&#8217;re getting married from left to right.</desc>

  <defs>
    <!-- Rough edges and broken pigment imitate a soft pastel pencil. -->
    <filter id="pastel" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.42"
                    numOctaves="3"
                    seed="23"
                    result="grain"/>
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.018"
                    numOctaves="2"
                    seed="9"
                    result="wobble"/>
      <feDisplacementMap in="SourceGraphic"
                         in2="wobble"
                         scale="1.7"
                         xChannelSelector="R"
                         yChannelSelector="G"
                         result="rough"/>
      <feComposite in="grain"
                   in2="rough"
                   operator="in"
                   result="chalkGrain"/>
      <feComponentTransfer in="rough" result="softBase">
        <feFuncA type="linear" slope="0.72"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="softBase"/>
        <feMergeNode in="chalkGrain"/>
      </feMerge>
    </filter>

    <style>
      .ink {
        fill: none;
        stroke: #fffdf8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw var(--duration) cubic-bezier(.4,0,.18,1) forwards;
        animation-delay: var(--delay);
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .ink { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Every letter below is a hand-shaped Bézier path; there is no font. -->
  <g filter="url(#pastel)">
    <!-- We’re -->
    <path class="ink" pathLength="1" stroke-width="8.2"
          style="--delay:.09s;--duration:.64s"
          d="M88 326 C81 366 76 444 88 465
             C96 480 107 466 118 436
             C134 391 146 342 160 314
             C168 298 173 303 171 326
             C166 371 166 446 178 467
             C186 480 198 462 210 430
             C226 387 238 342 253 311"/>
    <path class="ink" pathLength="1" stroke-width="6.4"
          style="--delay:.46s;--duration:.29s"
          d="M244 430 C257 414 283 413 287 426
             C291 439 270 449 254 444
             C241 440 244 424 255 418
             C271 410 285 423 292 437
             C300 452 313 452 325 437"/>
    <path class="ink" pathLength="1" stroke-width="6"
          style="--delay:.62s;--duration:.27s"
          d="M322 449 C329 432 332 414 337 413
             C343 412 339 431 342 432
             C347 433 352 412 363 412
             C372 412 372 421 366 429
             C362 435 368 447 380 448"/>
    <path class="ink" pathLength="1" stroke-width="6.2"
          style="--delay:.76s;--duration:.28s"
          d="M379 430 C391 414 416 413 420 426
             C424 438 403 449 388 444
             C376 440 379 425 390 419
             C405 411 418 423 425 437
             C432 451 444 451 454 438"/>
    <path class="ink" pathLength="1" stroke-width="6.5"
          style="--delay:.82s;--duration:.12s"
          d="M320 378 C324 369 325 361 323 354"/>

    <!-- getting -->
    <g transform="translate(55 0)">
    <path class="ink" pathLength="1" stroke-width="6.8"
          style="--delay:.91s;--duration:.37s"
          d="M491 421 C477 412 463 426 466 440
             C469 454 484 451 492 436
             C499 423 503 412 504 414
             C503 439 499 475 491 491
             C482 509 465 511 460 499
             C456 488 470 480 488 483
