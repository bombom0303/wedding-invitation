          d="M522 431 C535 414 560 414 564 427
             C568 439 547 450 532 444
             C520 440 523 425 534 419
             C550 411 562 424 569 438
             C576 451 587 450 596 437"/>
    <path class="ink" pathLength="1" stroke-width="6.3"
          style="--delay:1.25s;--duration:.26s"
          d="M607 382 C604 401 600 423 597 439
             C594 453 603 455 616 439
             M590 411 C603 409 616 409 626 407"/>
    <path class="ink" pathLength="1" stroke-width="6.2"
