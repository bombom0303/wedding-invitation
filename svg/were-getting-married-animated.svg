          d="M677 416 C675 426 670 445 677 449
             C685 453 694 442 700 432"/>
    <path class="ink" pathLength="1" stroke-width="7"
          style="--delay:1.61s;--duration:.09s"
          d="M685 389 L686 388"/>
    <path class="ink" pathLength="1" stroke-width="6.1"
          style="--delay:1.65s;--duration:.29s"
