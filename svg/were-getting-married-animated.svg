             C739 672 744 660 748 657
             C745 671 738 689 748 695
             C760 702 776 686 786 674"/>

    <!-- A few faint parallel deposits make the pigment less digitally perfect. -->
    <path class="ink" pathLength="1" stroke-width="2.2" opacity=".48"
          style="--delay:.29s;--duration:.27s"
          d="M94 341 C89 379 86 426 91 454"/>
    <path class="ink" pathLength="1" stroke-width="2" opacity=".42"
          style="--delay:2.20s;--duration:.20s"
          d="M262 662 C260 675 259 687 262 693"/>
    <path class="ink" pathLength="1" stroke-width="2.1" opacity=".44"
          style="--delay:3.09s;--duration:.20s"
          d="M716 579 C712 607 705 641 698 670"/>
  </g>
</svg>
